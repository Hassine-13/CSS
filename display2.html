<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav a{

            text-decoration: none;
            margin: 45px;
            background-color: rgba(227, 135, 64, 0.4);
            width: 50px;
            box-shadow: 6px 7px 7px rgb(168, 233, 130);

            margin: 40px;
            width: 50px;
            box-shadow: 6px 7px 7px rgb(88, 153, 203);
          
        }
        #hover:hover{
            visibility: hidden;
        }

    </style>
</head>
<body>

    <a href="">Service</a>
    <a href="">Product</a>

        <li>list2</li>
        <li>list3</li>
        <li>list4</li>
        <li>list5</li>
        <li>list6</li>
    </ul>

    
</body>
</html>
