<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            position: relative;
            width: 400px;
            height: 250px;
            background-color: lightcoral;
        }

        .child{
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 60px;
            background-color: darkkhaki;
        }
    </style>
</head>
<body>
    <div class="parent">
        Parent box
    
    <div class="child">
        Child box
    </div>

    </div>
    
</body>
</html>
